spring:
  application:
    name: school-library

  datasource:
    url: jdbc:mysql://localhost:3306/school_library?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 本地默认密码 123456（与本地 MySQL root 密码一致，便于 IDE 直接运行 LibraryApplication）。
    # 部署/ Docker/生产环境务必通过环境变量 DB_PASSWORD 覆盖，不要依赖这个默认值。
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # none：表结构由 db/schema.sql 负责，Hibernate 只做映射、不校验/不自动建表。
      # 说明：Hibernate 6.4 + MySQL 对 @Enumerated(STRING) 枚举列做 schema 校验时会误判为原生 ENUM，
      # 与库里的 VARCHAR 列不一致而启动失败；运行期 @Enumerated(STRING) 仍以字符串读写 VARCHAR，行为正确。
      # 若改为 validate/update，本地首次启动会因该误判报错。
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    # 生产环境应通过环境变量覆盖
    secret: ${JWT_SECRET:school-library-default-secret-key-change-me-in-production-0123456789}
    expire-days: 7
  library:
    # 借阅规则（集中配置，见 CirculationPolicy）
    fine-per-day: 0.10
    reminder-days: 3
  seed:
    # 首次启动时初始化测试账号与示例图书（测试环境关闭）
    enabled: true
