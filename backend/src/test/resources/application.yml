spring:
  application:
    name: school-library-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: test-secret-key-for-integration-tests-0123456789abcdef
    expire-days: 7
  library:
    fine-per-day: 0.10
    reminder-days: 3
  seed:
    # 测试自带数据构造，关闭种子数据避免账号冲突
    enabled: false
