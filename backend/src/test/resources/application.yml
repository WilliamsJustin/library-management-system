spring:
  application:
    name: school-library-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 换成 MyBatis-Plus 后不再有 Hibernate ddl-auto 自动建表，改为启动时执行 H2 版建表脚本。
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql

  jackson:
    default-property-inclusion: non_null

# 测试用的 application.yml 会覆盖 main 里的同名文件，所以这里必须重复声明 MyBatis-Plus 配置。
mybatis-plus:
  type-aliases-package: com.school.library.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: test-secret-key-for-integration-tests-0123456789abcdef
    expire-days: 7
  library:
    fine-per-day: 0.10
    reminder-days: 3
  seed:
    # 测试自带数据构造，关闭种子数据避免账号冲突
    enabled: false
