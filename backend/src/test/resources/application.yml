spring:
  application:
    name: school-library-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 换成 MyBatis-Plus 后不再有 Hibernate ddl-auto 自动建表，改为启动时执行 H2 版建表脚本。
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql

  # 说明：这里刻意不配 Redis / 不排除 Spring Session 自动装配。
  # 测试要跑真实的 Spring Session 过滤器链（会话 Cookie + 请求头解析、会话写入与失效），
  # 但不想依赖外部 Redis 服务，所以由 support/InMemorySessionConfig 提供一个内存版
  # SessionRepository 顶替 RedisSessionRepository（Spring Boot 见到已有 SessionRepository 就不再建 Redis 的那套）。
  # session 超时时长由 app.session.timeout-minutes 控制，见 SessionTimeoutInterceptorTest。

  jackson:
    default-property-inclusion: non_null

# 测试用的 application.yml 会覆盖 main 里的同名文件，所以这里必须重复声明 MyBatis-Plus 配置。
mybatis-plus:
  type-aliases-package: com.school.library.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  session:
    # 会话空闲超时（分钟），与 main 保持一致
    timeout-minutes: 30
  library:
    loan-minutes: 10
    fine-per-minute: 0.10
    reminder-minutes: 5
    check-interval-ms: 30000
    # 测试里必须关掉定时器：借期只有 10 分钟，轮询间隔是 30 秒，
    # 定时器会在上下文启动后立刻跑第一轮并跑进测试事务，干扰断言。
    # 关掉后 OverdueTask 业务方法仍在，测试直接调用 task.checkOnce() 即可。
    scheduling-enabled: false
  seed:
    # 测试自带数据构造，关闭种子数据避免账号冲突
    enabled: false
